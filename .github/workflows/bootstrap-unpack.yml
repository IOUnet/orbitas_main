name: Materialize Orbitas bootstrap

on:
  push:
    branches: [bootstrap]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct staged archive
        shell: bash
        run: |
          set -euo pipefail
          for i in 00 01 02 03 04 06 07 08; do
            test -s "bootstrap/chunk-${i}.b64"
          done
          for i in 00 01 02 03 04 05; do
            test -s "bootstrap/chunk-05-${i}.b64"
          done
          cat bootstrap/chunk-{00..04}.b64 > /tmp/orbitas-bootstrap.b64
          cat bootstrap/chunk-05-{00..05}.b64 >> /tmp/orbitas-bootstrap.b64
          cat bootstrap/chunk-{06..08}.b64 >> /tmp/orbitas-bootstrap.b64
          test "$(wc -c < /tmp/orbitas-bootstrap.b64)" -eq 156212
          base64 --decode /tmp/orbitas-bootstrap.b64 > /tmp/orbitas-bootstrap.zip
          unzip -t /tmp/orbitas-bootstrap.zip
          rm -rf /tmp/orbitas-bootstrap
          mkdir -p /tmp/orbitas-bootstrap
          unzip -q /tmp/orbitas-bootstrap.zip -d /tmp/orbitas-bootstrap
          test -f /tmp/orbitas-bootstrap/orbitas_main/AGENTS.md
          test -f /tmp/orbitas-bootstrap/orbitas_main/src/MultidimensionalObligation.sol
          test -f /tmp/orbitas-bootstrap/orbitas_main/indexer/subgraph.yaml

      - name: Materialize repository tree
        shell: bash
        run: |
          set -euo pipefail
          # The default GITHUB_TOKEN cannot create/update workflow files in this repository.
          # Materialize everything else first; workflow files are added later by the authorized GitHub connector.
          rsync -a --exclude='.github/workflows/' /tmp/orbitas-bootstrap/orbitas_main/ ./
          rm -rf bootstrap
          git status --short

      - name: Commit materialized bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "orbitas-bootstrap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes"
            exit 0
          fi
          git commit -m "chore: materialize Orbitas bootstrap [materialized]"
          git push origin HEAD:bootstrap
