name: indexer
on:
  pull_request:
    paths: ["indexer/**"]
  push:
    branches: [main]
    paths: ["indexer/**"]
permissions:
  contents: read
jobs:
  subgraph-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: MCP install/build
        working-directory: indexer/mcp
        run: npm install && npm run build
      - name: Subgraph install
        working-directory: indexer
        run: npm install
      - name: Subgraph codegen/build note
        run: echo "Run graph codegen/build after deployment-specific subgraph.yaml values and final compiled ABIs are supplied."
