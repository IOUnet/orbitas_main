[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true

[fuzz]
runs = 1024
failure_persist_file = "cache/fuzz-failures"

[invariant]
runs = 256
depth = 128
fail_on_revert = true
failure_persist_dir = "cache/invariant"

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 256
fail_on_revert = true
